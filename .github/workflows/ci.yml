# Pull-request checks. No AWS credentials in this workflow: Terraform tests use a
# mocked provider and checkov is static analysis.
# Phase 8 extends this file with app lint/test, docker build and Trivy jobs.
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iac:
    name: terraform test + checkov
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.7
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive infra/terraform

      # Until Phase 5 adds the dev configuration, envs/dev holds only its tests.
      # Skipping is announced as a warning; once any *.tf exists the tests must pass.
      - name: terraform validate + test (mocked provider)
        run: |
          set -euo pipefail
          for dir in infra/terraform/envs/*/; do
            if ! compgen -G "${dir}*.tf" > /dev/null; then
              echo "::warning::${dir} has no Terraform configuration yet; tests skipped"
              continue
            fi
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            terraform -chdir="$dir" test
          done

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: install checkov
        run: pip install -r requirements-infra.txt

      - name: checkov
        run: checkov
