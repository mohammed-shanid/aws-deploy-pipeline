- name: Install repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-debian # needed by deb822_repository
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Docker's apt signing key (checksum pinned)
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    checksum: "sha256:{{ docker_apt_key_sha256 }}"
    owner: root
    group: root
    mode: "0644"

- name: Add Docker's official apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    signed_by: /etc/apt/keyrings/docker.asc
  notify: Refresh apt cache

- name: Pin Docker to one major version
  ansible.builtin.template:
    src: docker-pin.pref.j2
    dest: /etc/apt/preferences.d/docker
    owner: root
    group: root
    mode: "0644"

# The new repository must be in the cache before the install below.
- name: Refresh the apt cache now if the repository changed
  ansible.builtin.meta: flush_handlers

- name: Create the Docker configuration directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

# Written before the package is installed, so the first start already uses it.
- name: Configure the Docker daemon (log rotation)
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

- name: Install Docker
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

# Docker group membership is root-equivalent (security.md §4): only this user.
- name: Let the deploy user run containers
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: docker
    append: true
