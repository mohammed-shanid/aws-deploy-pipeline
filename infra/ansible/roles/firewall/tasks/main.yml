- name: Check the SSH source is a single address
  ansible.builtin.assert:
    that: firewall_ssh_cidr == "" or firewall_ssh_cidr is ansible.builtin.regex('^[0-9.]+/32$')
    fail_msg: "firewall_ssh_cidr must be empty or a /32, got '{{ firewall_ssh_cidr }}'"
    quiet: true

- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set default policies (deny incoming, allow outgoing)
  community.general.ufw:
    direction: "{{ item.direction }}"
    default: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

- name: Allow public web ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ firewall_public_tcp_ports }}"

- name: Allow SSH from the operator address only
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    from_ip: "{{ firewall_ssh_cidr }}"
  when: firewall_ssh_cidr != ""

- name: Remove any rule that opens SSH to everyone
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    delete: true

- name: Enable ufw
  community.general.ufw:
    state: enabled
