- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set the timezone
  community.general.timezone:
    name: "{{ base_timezone }}"

- name: Create the deploy user (non-root, no password)
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    password: "!"
    create_home: true

- name: Enable unattended security upgrades
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Enable the unattended-upgrades service and apt timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - unattended-upgrades.service
    - apt-daily.timer
    - apt-daily-upgrade.timer

- name: Enable the logrotate timer
  ansible.builtin.systemd_service:
    name: logrotate.timer
    enabled: true
    state: started
