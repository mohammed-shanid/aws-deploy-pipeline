# Applies when ansible-playbook runs from infra/ansible (idempotence.sh does that).
[defaults]
roles_path = roles
# Collections are pinned in collections/requirements.yml and installed into the
# repo-root .ansible/ (gitignored), the same place ansible-lint looks.
collections_path = ../../.ansible/collections
interpreter_python = /usr/bin/python3

[ssh_connection]
pipelining = True
