# Local test target: an OrbStack Ubuntu 24.04 machine on this Mac. Never an AWS host.
# Created and started by infra/ansible/tests/orb_machine.sh.
#
# OrbStack's built-in SSH server listens on localhost:32222 and selects the
# machine from the user name "<user>@<machine>". The default machine user is the
# macOS user, with passwordless sudo.
all:
  children:
    local:
      hosts:
        adp-noble:
          ansible_host: 127.0.0.1
          ansible_port: 32222
          ansible_user: "{{ lookup('ansible.builtin.env', 'USER') }}@adp-noble"
          ansible_ssh_private_key_file: "~/.orbstack/ssh/id_ed25519"
          # Trust-on-first-use into a harness-owned known_hosts, not ~/.ssh/known_hosts.
          # orb_machine.sh removes it whenever it recreates the machine.
          ansible_ssh_common_args: >-
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile={{ inventory_dir }}/../../../../.harness/known_hosts
